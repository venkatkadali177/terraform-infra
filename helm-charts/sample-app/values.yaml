replicaCount: 1

app:
  name: nginx

image:
  repository: 388439400978.dkr.ecr.ap-south-1.amazonaws.com/sample-app
  tag: "16-b0a09542"
  pullPolicy: IfNotPresent

service:
  name: nginx-service
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  name: nginx-ingress
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi